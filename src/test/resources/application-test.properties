# Overlays the main configuration (which still applies) with a database for the test run.
#
# Tests run against a real, file-backed database - never an in-memory one - so the unique index,
# the FOR UPDATE row locks and the invoice snapshot under test are the same mechanisms that run in
# production. The file is new for each JVM run and lives under target/, so `mvn clean` removes it.
# LOCK_TIMEOUT is set here too, because overriding the whole URL would otherwise drop the one
# from the main configuration. It is shorter than production's 10s so the contention test is
# quick, but it exercises the same mechanism.
spring.datasource.url=jdbc:h2:file:./target/test-db/billing-${random.uuid};DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=2000
