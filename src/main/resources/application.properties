spring.application.name=travel-billing-service
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:${BILLING_DB_PATH:./data/billing};DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=${BILLING_DB_USER:sa}
spring.datasource.password=${BILLING_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.pool-name=billing-pool

# Flyway owns the schema. No ORM auto-DDL anywhere.
spring.flyway.locations=classpath:db/migration

# Wire format: snake_case in, snake_case out; nulls omitted (an untaxed line has no rate).
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

spring.threads.virtual.enabled=true
